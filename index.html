.glass-container {

.spinner-center { position: absolute; inset: 25px; border-radius: 50%; background: var(--gold); box-shadow: 0 0 15px var(--gold); animation: pulse 1.5s ease-in-out infinite; }
@keyframes spin { 100% { transform: rotate(360deg); } }
@keyframes spin-reverse { 100% { transform: rotate(-360deg); } }
@keyframes pulse { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(0.8); opacity: 0.6; } }

const approvedReady = new Promise(resolve => approvedReadyResolve = resolve);

function getVipCoreVote(seqChrono){
  if(!Array.isArray(seqChrono)||seqChrono.length<5)return null;
  const bits=seqChrono.map(x=>x==='B'?1:0);
  const n=bits.length;
  const vWin=bits.slice(-Math.min(5,n));
  const vSum=vWin.reduce((a,b)=>a+b,0);
  const vVote=vSum%2===0?'B':'S';
  const last2=bits.slice(-2);
  const iVal=last2[0]*2+last2[1];
  const iVote=iVal>=2?'B':'S';
  const last3=bits.slice(-3).join('');
  const colorMap={'000':'S','001':'S','010':'B','011':'B','100':'B','101':'S','110':'B','111':'S'};
  const pVote=colorMap[last3]||'S';
  let bV=0,sV=0;
  if(vVote==='B')bV++;else sV++;
  if(iVote==='B')bV++;else sV++;
  if(pVote==='B')bV++;else sV++;
  let aiVal,tieBreak='consensus';
  if(bV>sV)aiVal='B';
  else if(sV>bV)aiVal='S';
  else{const avg=bits.reduce((a,b)=>a+b,0)/n;aiVal=avg>=0.5?'S':'B';tieBreak='mean-reversion'}
  const consensus=Math.max(bV,sV)/3;
  const confidence=0.60+consensus*0.30;
  return{value:aiVal,source:'VIP Core',weight:3.2,reason:'V:'+vVote+' • I:'+iVote+' • P:'+pVote+' → '+aiVal,confidence:confidence};
}

function getKeyMapVote(periodId){
  if(!periodId||periodId.length<2)return null;
  const last2=periodId.slice(-2),key=last2+last2;
  const result=KEY_MAP[key];
  if(!result)return null;
  return{value:result,source:'keyMap',weight:1,key:key,reason:'Key '+key+' → '+result,keyDisplay:key};
}

function getNumberChartVote(){

function getComebackVote(seqChrono,periodId){
  const numVote=getNumberChartVote();
  const keyMapVote=getKeyMapVote(periodId);
  const comebackVotes=[];
  if(numVote)comebackVotes.push(numVote);

  const bVotes=comebackVotes.filter(v=>v.value==='B');
  const sVotes=comebackVotes.filter(v=>v.value==='S');
  const bWeight=bVotes.reduce((sum,v)=>sum+v.weight,0);
  const sWeight=sVotes.reduce((sum,v)=>sum+v.weight,0);
  let value,confidence,patternName,reason;
  if(bWeight===sWeight){
    if(keyMapVote&&keyMapVote.value){value=keyMapVote.value;confidence=0.65;patternName='TIEBREAK-KEYMAP';reason='COMEBACK tie → KeyMap '+keyMapVote.keyDisplay+' = '+value}
    else{return null}
  }else{
    const winner=bWeight>sWeight?'B':'S';
    const winnerVotes=comebackVotes.filter(v=>v.value===winner);
    const loserVotes=comebackVotes.filter(v=>v.value!==winner);
    if(comebackVotes.length===3&&loserVotes.length===0){confidence=0.95;patternName='3-0 UNANIMOUS'}
    else if(comebackVotes.length===3&&winnerVotes.length===2){confidence=0.80;patternName='2-1 MAJORITY'}
    else if(comebackVotes.length===2&&loserVotes.length===0){confidence=0.90;patternName='2-0 AGREE'}
    else if(comebackVotes.length===2){confidence=0.72;patternName='WEIGHTED'}
    else{confidence=Math.min(1,(winnerVotes[0].weight||1)*0.85);patternName=(winnerVotes[0].source||'Single')+' Only'}
    value=winner;
    reason='COMEBACK '+patternName+' → '+value;
  }
  return{value:value,source:'COMEBACK',weight:3.5,confidence:confidence,reason:reason,detail:'COMEBACK',pattern:patternName,isConflict:false,isSkip:false,chartSource:!!numVote};
}

function akatsukiGetBSHistory(){

function akatsukiComputeBSWeights(bs){
  if(!bs.length||bs.length<3){const r=Math.random();return {B:r,S:1-r}}
  let streak=1;
  for(let i=1;i<Math.min(bs.length,8);i++){if(bs[i]===bs[0])streak++;else break}
  let wB=0.5,wS=0.5;
  if(streak>=4){if(bs[0]==='B'){wS+=0.32;wB-=0.32}else{wB+=0.32;wS-=0.32}}
  else if(streak>=3){if(bs[0]==='B'){wS+=0.22;wB-=0.22}else{wB+=0.22;wS-=0.22}}
  else if(streak>=2){if(bs[0]==='B'){wS+=0.10;wB-=0.10}else{wB+=0.10;wS-=0.10}}
  const last10=bs.slice(0,10);
  const bCnt=last10.filter(x=>x==='B').length;
  const sCnt=last10.length-bCnt;
  if(bCnt>=8){wS+=0.26;wB-=0.26}else if(bCnt>=7){wS+=0.18;wB-=0.18}else if(bCnt>=6){wS+=0.08;wB-=0.08}
  if(sCnt>=8){wB+=0.26;wS-=0.26}else if(sCnt>=7){wB+=0.18;wS-=0.18}else if(sCnt>=6){wB+=0.08;wS-=0.08}
  let alt=0;
  const altLen=Math.min(bs.length-1,12);
  for(let i=0;i<altLen;i++){if(bs[i]!==bs[i+1])alt++}
  const altRate=altLen>0?alt/altLen:0.5;
  if(altRate>0.72){if(bs[0]==='B'){wS+=0.20;wB-=0.20}else{wB+=0.20;wS-=0.20}}
  else if(altRate<0.28){if(bs[0]==='B'){wB+=0.12;wS-=0.12}else{wS+=0.12;wB-=0.12}}
  let bAfter=0,sAfter=0;
  for(let i=1;i<bs.length;i++){if(bs[i]===bs[0]){if(bs[i-1]==='B')bAfter++;else sAfter++}}
  const trTot=bAfter+sAfter;
  if(trTot>2){const frac=bAfter/trTot;wB+=(frac-0.5)*0.30;wS-=(frac-0.5)*0.30}
  wB=Math.max(0.05,Math.min(0.95,wB));
  wS=Math.max(0.05,Math.min(0.95,wS));
  const tot=wB+wS;
  return{B:wB/tot,S:wS/tot};
}

function akatsukiDojutsu(bs){const ws=akatsukiComputeBSWeights(bs);const value=ws.B>=ws.S?'B':'S';const signal=Math.abs(ws.B-ws.S);const confidence=Math.min(0.97,0.76+signal*0.50);return{value:value,confidence:confidence,detail:'B:'+ws.B.toFixed(2)+' S:'+ws.S.toFixed(2)}}
function akatsukiGenjutsu(bs){const base=akatsukiDojutsu(bs);let streak=1;for(let i=1;i<Math.min(bs.length,5);i++){if(bs[i]===bs[0])streak++;else break}if(streak<=1){const flipped=base.value==='B'?'S':'B';return{value:flipped,confidence:Math.max(0.75,base.confidence-0.02),detail:'Inversion'}}return base}
function akatsukiClan(bs){if(bs.length<6)return akatsukiDojutsu(bs);const key=bs.slice(0,3).join('');for(let i=3;i<bs.length-3;i++){if(bs.slice(i,i+3).join('')===key){const next=bs[i-1];return{value:next,confidence:0.93,detail:'Pattern @'+i+'→'+next}}}return akatsukiDojutsu(bs)}
function akatsukiVoid(bs){if(bs.length<4)return akatsukiDojutsu(bs);const lastB=bs.indexOf('B'),lastS=bs.indexOf('S');const gapB=lastB===-1?bs.length:lastB;const gapS=lastS===-1?bs.length:lastS;const value=gapB>gapS?'B':(gapS>gapB?'S':'B');return{value:value,confidence:0.89,detail:'Gap B:'+gapB+' S:'+gapS}}

function getAkatsukiVote(){

function combinedAnalysis(seqChrono,periodId){
  const vipVote=getVipCoreVote(seqChrono);
  const omniVote=getComebackVote(seqChrono,periodId);

  if(votes.length===0){
    let forced='B';
    if(seqChrono.length>=1){const last=seqChrono[seqChrono.length-1];forced=last==='B'?'S':'B'}
    return{value:forced,confidence:0.55,pattern:'EARLY',reason:'Early → '+forced,isConflict:false,isSkip:false};
  }
  
  const bVotes=votes.filter(v=>v.value==='B'),sVotes=votes.filter(v=>v.value==='S');
  const bWeight=bVotes.reduce((sum,v)=>sum+v.weight,0);
  const sWeight=sVotes.reduce((sum,v)=>sum+v.weight,0);
  
  let winner;
  if(bWeight>sWeight)winner='B';
  else if(sWeight>bWeight)winner='S';
  else{const heaviest=votes.slice().sort((a,b)=>b.weight-a.weight)[0];winner=heaviest?heaviest.value:'B'}
  
  const winnerVotes=votes.filter(v=>v.value===winner);
  const totalVotes=votes.length;
  let confidence,patternName;
  
  if(totalVotes===2&&winnerVotes.length===2){confidence=.90;patternName='2-0 AGREE'}
  else if(totalVotes===2){confidence=.72;patternName='WEIGHTED VOTE'}
  else{confidence=Math.max.apply(null,winnerVotes.map(v=>v.confidence||0.68));patternName=winnerVotes[0].source+' Only'}
  
  return{value:winner,confidence:confidence,pattern:patternName,reason:patternName+' → '+winner,isConflict:false,isSkip:false};
}

function extractApiRows(payload){
  const found=[],seen=new Set();
  function walk(node,depth){
    if(!node||typeof node!=='object'||depth>8||seen.has(node))return;
    seen.add(node);
    if(Array.isArray(node)){for(const item of node)walk(item,depth+1);return}
    const issueRaw=node.issueNumber!=null?node.issueNumber:(node.issue_number!=null?node.issue_number:(node.issue!=null?node.issue:(node.period!=null?node.period:(node.periodNumber!=null?node.periodNumber:node.issue_no))));
    const raw=node.number!=null?node.number:(node.resultNumber!=null?node.resultNumber:(node.result_number!=null?node.result_number:(node.result!=null?node.result:(node.openNumber!=null?node.openNumber:node.winNumber))));
    if(issueRaw!==undefined&&raw!==undefined){
      const issue=String(issueRaw).trim();
      const match=String(raw).match(/(?:^|\D)([0-9])(?:\D|$)/);
      const number=match?Number(match[1]):NaN;
      if(issue&&Number.isFinite(number)&&number>=0&&number<=9)found.push({issue:issue,number:number,value:number>=5?'B':'S'});
    }
    Object.values(node).forEach(function(v){walk(v,depth+1)});
  }
  walk(payload,0);
  const unique=Array.from(new Map(found.map(function(r){return [r.issue,r]})).values());
  unique.sort(function(a,b){
    if(/^\d+$/.test(a.issue)&&/^\d+$/.test(b.issue)){const aa=BigInt(a.issue),bb=BigInt(b.issue);return aa<bb?-1:aa>bb?1:0}
    return a.issue.localeCompare(b.issue,undefined,{numeric:true});
  });
  return unique;
}

  try{

      updatePrediction();renderAll();
    }else if(apiLastIssue[gameMode]!==last.issue){
      let fresh=rows.filter(function(r){
        if(/^\d+$/.test(r.issue)&&/^\d+$/.test(String(apiLastIssue[gameMode]||'')))return BigInt(r.issue)>BigInt(apiLastIssue[gameMode]);
        return String(r.issue).localeCompare(String(apiLastIssue[gameMode]||''),undefined,{numeric:true})>0;
      });
      if(!fresh.length)fresh=[last];
      fresh.forEach(function(r){applyApiResult(r)});
      apiLastIssue[gameMode]=last.issue;
      setApiNumberChart();updatePrediction();renderAll();
    }else{
      setApiNumberChart();updatePrediction();renderAll();
    }
  }catch(err){
    console.warn('API failed, but UI is alive via seeded data.');
  }finally{apiBusy=false}
}

function startApiPolling(){
  if(apiPollTimer)clearInterval(apiPollTimer);
  pollGameAPI();
  apiPollTimer=setInterval(pollGameAPI,3000);
}

function switchMode(m){
  if(m===gameMode)return;
  gameMode=m;
  apiSeeded[m]=false;apiLastIssue[m]=null;
  window10=new Array(TOTAL).fill(null);hiddenHistory=[];mode='setup';lockedPred=null;lastAddedIndex=-1;
  history=[];snapshots=[];
  currentLevel=1; highestLevel=1;
  
  $('oneMinBtn').classList.toggle('active',gameMode==='1min');
  $('thirtySecBtn').classList.toggle('active',gameMode==='30sec');
  renderAll();updateTimerAndPeriod();
  pollGameAPI();
}

// INIT
setInterval(updateTimerAndPeriod, 1000);
updateTimerAndPeriod();
renderBoxes();
startApiPolling(); 
</script>
